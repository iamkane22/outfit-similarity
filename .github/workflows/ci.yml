name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check src tests app
      - run: uv run ruff format --check src tests app
      - run: uv run mypy
      # Tests use a deterministic fake encoder: no model download, no GPU.
      - run: uv run pytest --cov=outfit_search --cov-report=term-missing
